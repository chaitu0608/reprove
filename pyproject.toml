[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reprove-security"
version = "0.1.0"
description = "Prove the exploit. Fix the app. Re-prove it. Proof-carrying security for vibe-coded apps — MCP-native."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Chaitanya", email = "chaitu0608@users.noreply.github.com" }]
keywords = ["security", "mcp", "appsec", "vibe-coding", "supabase", "rls", "idor", "sast", "dast", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/chaitu0608/reprove"
Issues = "https://github.com/chaitu0608/reprove/issues"

[project.scripts]
reprove = "reprove.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
